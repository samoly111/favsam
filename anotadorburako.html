<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotador de Burako</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e0e0e0;
        }
        h1 {
            color: #ff7900;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scoreboard {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
        }
        .teams {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .team {
            text-align: center;
            width: 45%;
        }
        .team input[type="text"] {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            width: 100%;
            border: none;
            border-bottom: 2px solid #444;
            padding-bottom: 5px;
            margin-bottom: 5px;
            background: transparent;
            color: #ff9500;
        }
        .team input[type="text"]:focus {
            outline: none;
            border-bottom: 2px solid #ff7900;
        }
        .team-total {
            font-size: 3em;
            font-weight: bold;
            color: #ff7900;
            margin: 5px 0 15px 0;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }
        .input-group {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            text-align: center;
            font-weight: bold;
            color: #bbb;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .controls input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1.1em;
            text-align: center;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .controls input[type="number"]:focus {
            outline: none;
            border-color: #ff7900;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1.1em;
            font-weight: bold;
            color: #121212;
            background-color: #ff7900;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #e66c00;
        }
        button:active {
            transform: scale(0.98);
        }
        
        /* Botones de acción secundaria */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons button {
            margin-top: 0;
            padding: 10px;
            font-size: 1em;
        }
        button.save { 
            background-color: #2a2a2a; 
            color: #ff9500; 
            border: 1px solid #ff9500; 
        }
        button.save:hover { 
            background-color: #ff9500; 
            color: #121212; 
        }
        
        button.load { 
            background-color: #2a2a2a; 
            color: #e0e0e0; 
            border: 1px solid #555; 
        }
        button.load:hover { 
            background-color: #444; 
        }

        button.reset { 
            background-color: #3a1515; 
            color: #ff5555; 
            border: 1px solid #882222; 
        }
        button.reset:hover { 
            background-color: #d32f2f; 
            color: #ffffff; 
        }
        
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2a2a2a;
            color: #ff7900;
            font-weight: 600;
        }
        td {
            font-size: 1.1em;
            background-color: #1e1e1e;
        }
        .round-detail {
            font-size: 0.75em;
            color: #999;
            display: block;
            margin-top: 4px;
        }
        .negative {
            color: #ff5555;
        }
    </style>
</head>
<body>

    <h1>Anotador de Burako</h1>

    <div class="scoreboard">
        <!-- Nombres y Totales -->
        <div class="teams">
            <div class="team">
                <input type="text" id="name1" value="Nosotros">
                <div class="team-total" id="total1">0</div>
            </div>
            <div class="team">
                <input type="text" id="name2" value="Ellos">
                <div class="team-total" id="total2">0</div>
            </div>
        </div>

        <!-- Ingreso de puntos desglosado -->
        <div class="controls">
            <div class="input-group">
                <label id="lbl-name1">Nosotros</label>
                <input type="number" id="base1" placeholder="Puntos Base" onkeypress="handleEnter(event)">
                <input type="number" id="fichas1" placeholder="Puntos Fichas" onkeypress="handleEnter(event)">
            </div>
            <div class="input-group">
                <label id="lbl-name2">Ellos</label>
                <input type="number" id="base2" placeholder="Puntos Base" onkeypress="handleEnter(event)">
                <input type="number" id="fichas2" placeholder="Puntos Fichas" onkeypress="handleEnter(event)">
            </div>
        </div>

        <button onclick="addScores()">Anotar Ronda</button>
        
        <!-- Tabla de historial -->
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Ronda</th>
                    <th id="thName1">Nosotros</th>
                    <th id="thName2">Ellos</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- Las rondas se agregarán aquí -->
            </tbody>
        </table>
        
        <!-- Controles de guardado y reinicio -->
        <div class="action-buttons">
            <button class="save" onclick="saveGame()">💾 Guardar</button>
            <button class="load" onclick="loadGame()">📂 Cargar</button>
        </div>
        
        <button class="reset" onclick="resetGame()">🗑️ Reiniciar Partida</button>
    </div>

    <script>
        let total1 = 0;
        let total2 = 0;
        let round = 1;

        // Sincronizar nombres
        document.getElementById('name1').addEventListener('input', updateNames);
        document.getElementById('name2').addEventListener('input', updateNames);

        function updateNames() {
            const n1 = document.getElementById('name1').value || 'Equipo 1';
            const n2 = document.getElementById('name2').value || 'Equipo 2';
            
            document.getElementById('thName1').innerText = n1;
            document.getElementById('lbl-name1').innerText = n1;
            document.getElementById('thName2').innerText = n2;
            document.getElementById('lbl-name2').innerText = n2;
        }

        // Permitir usar la tecla Enter
        function handleEnter(event) {
            if (event.key === 'Enter') {
                addScores();
            }
        }

        function addScores() {
            const base1Input = document.getElementById('base1');
            const fichas1Input = document.getElementById('fichas1');
            const base2Input = document.getElementById('base2');
            const fichas2Input = document.getElementById('fichas2');

            const b1 = parseInt(base1Input.value) || 0;
            const f1 = parseInt(fichas1Input.value) || 0;
            const b2 = parseInt(base2Input.value) || 0;
            const f2 = parseInt(fichas2Input.value) || 0;

            if (base1Input.value === "" && fichas1Input.value === "" && 
                base2Input.value === "" && fichas2Input.value === "") {
                return; 
            }

            const p1 = b1 + f1;
            const p2 = b2 + f2;

            total1 += p1;
            total2 += p2;

            document.getElementById('total1').innerText = total1;
            document.getElementById('total2').innerText = total2;

            const tbody = document.getElementById('historyBody');
            const row = document.createElement('tr');
            
            const classP1 = p1 < 0 ? 'negative' : '';
            const classP2 = p2 < 0 ? 'negative' : '';

            row.innerHTML = `
                <td>${round}</td>
                <td class="${classP1}">
                    <strong>${p1}</strong>
                    <span class="round-detail">(B: ${b1} | F: ${f1})</span>
                </td>
                <td class="${classP2}">
                    <strong>${p2}</strong>
                    <span class="round-detail">(B: ${b2} | F: ${f2})</span>
                </td>
            `;
            
            tbody.appendChild(row);

            base1Input.value = '';
            fichas1Input.value = '';
            base2Input.value = '';
            fichas2Input.value = '';
            
            base1Input.focus();
            round++;
        }

        // --- FUNCIONES DE GUARDADO --- //

        function saveGame() {
            const gameState = {
                name1: document.getElementById('name1').value,
                name2: document.getElementById('name2').value,
                total1: total1,
                total2: total2,
                round: round,
                history: document.getElementById('historyBody').innerHTML
            };
            
            localStorage.setItem('burakoSaveData', JSON.stringify(gameState));
            alert('💾 ¡Partida guardada exitosamente!');
        }

        function loadGame() {
            const savedData = localStorage.getItem('burakoSaveData');
            
            if (savedData) {
                if(confirm('¿Deseas cargar la partida guardada? Se reemplazará la partida actual.')) {
                    const gameState = JSON.parse(savedData);
                    
                    // Restaurar variables lógicas
                    total1 = gameState.total1;
                    total2 = gameState.total2;
                    round = gameState.round;
                    
                    // Restaurar nombres en los inputs
                    document.getElementById('name1').value = gameState.name1;
                    document.getElementById('name2').value = gameState.name2;
                    updateNames(); // Sincroniza los nombres en la tabla y etiquetas
                    
                    // Restaurar totales visuales
                    document.getElementById('total1').innerText = total1;
                    document.getElementById('total2').innerText = total2;
                    
                    // Restaurar el historial de la tabla
                    document.getElementById('historyBody').innerHTML = gameState.history;
                }
            } else {
                alert('No hay ninguna partida guardada en este dispositivo.');
            }
        }

        function resetGame() {
            if(confirm("¿Estás seguro de que deseas reiniciar la partida? Los puntajes volverán a cero.")) {
                total1 = 0;
                total2 = 0;
                round = 1;
                document.getElementById('total1').innerText = total1;
                document.getElementById('total2').innerText = total2;
                document.getElementById('historyBody').innerHTML = '';
                
                if(localStorage.getItem('burakoSaveData') && confirm("¿Deseas borrar también la partida que tenías guardada?")) {
                    localStorage.removeItem('burakoSaveData');
                }
            }
        }
    </script>
</body>
</html>
