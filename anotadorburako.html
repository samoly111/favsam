<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotador de Burako</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
  :root {
    --bg: #1c1b18;
    --surface: #232220;
    --border: #3a3833;
    --text: #f2ede4;
    --muted: #b8b2a6;
    --placeholder: #757575;
    --accent: #c97a3d;
    --danger: #d9776a;
    --font-title: 'Fraunces', 'Georgia', serif;
    --font-body: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    margin: 0;
    padding: 24px 16px 40px;
  }

  .scoreboard { max-width: 480px; margin: 0 auto; }

  h1 {
    font-family: var(--font-title);
    font-weight: 900;
    color: var(--text);
    text-align: center;
    font-size: 2rem;
    margin: 0 0 20px;
  }

  label { color: var(--muted); font-size: 0.85rem; }

  /* Inputs */
  input[type="number"], input[type="text"] {
    width: 100%;
    background-color: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 3px;
    font-family: var(--font-body);
    font-size: 1rem;
    outline: none;
  }
  /* Sin flechas de subir/bajar */
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--placeholder); }

  /* Equipos y totales */
  .teams { display: flex; gap: 12px; margin-bottom: 20px; }
  .team { flex: 1; text-align: center; }
  .team input[type="text"] { text-align: center; color: var(--muted); }
  .team-total {
    font-family: var(--font-title);
    font-weight: 900;
    font-size: 3rem;
    color: var(--text);
    margin-top: 8px;
  }

  /* Ingreso de puntos */
  .controls { display: flex; gap: 12px; margin-bottom: 12px; }
  .input-group { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  /* Botón principal */
  button {
    width: 100%;
    background-color: var(--accent);
    color: var(--bg);
    border: none;
    padding: 12px 20px;
    border-radius: 3px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }

  /* Botones secundarios */
  .action-buttons { display: flex; gap: 12px; margin-bottom: 12px; }
  .save, .load, .reset {
    background-color: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 400;
  }
  .save:hover, .load:hover, .reset:hover {
    border-color: var(--accent);
    color: var(--accent);
    opacity: 1;
  }

  /* Tabla */
  table { width: 100%; border-collapse: collapse; margin: 24px 0; }
  th {
    background-color: var(--surface);
    color: var(--accent);
    font-family: var(--font-title);
    font-weight: 700;
    padding: 12px;
    border-bottom: 2px solid var(--border);
  }
  td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .round-detail { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
  .negative strong { color: var(--danger); }
</style>
</head>
<body>

    <h1>Anotador de Burako</h1>

    <div class="scoreboard">
        <!-- Nombres y Totales -->
        <div class="teams">
            <div class="team">
                <input type="text" id="name1" value="Nosotros">
                <div class="team-total" id="total1">0</div>
            </div>
            <div class="team">
                <input type="text" id="name2" value="Ellos">
                <div class="team-total" id="total2">0</div>
            </div>
        </div>

        <!-- Ingreso de puntos desglosado -->
        <div class="controls">
            <div class="input-group">
                <label id="lbl-name1">Nosotros</label>
                <input type="number" id="base1" placeholder="Puntos Base" onkeypress="handleEnter(event)">
                <input type="number" id="fichas1" placeholder="Puntos Fichas" onkeypress="handleEnter(event)">
            </div>
            <div class="input-group">
                <label id="lbl-name2">Ellos</label>
                <input type="number" id="base2" placeholder="Puntos Base" onkeypress="handleEnter(event)">
                <input type="number" id="fichas2" placeholder="Puntos Fichas" onkeypress="handleEnter(event)">
            </div>
        </div>

        <button onclick="addScores()">Anotar Ronda</button>
        
        <!-- Tabla de historial -->
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Ronda</th>
                    <th id="thName1">Nosotros</th>
                    <th id="thName2">Ellos</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- Las rondas se agregarán aquí -->
            </tbody>
        </table>
        
        <!-- Controles de guardado y reinicio -->
        <div class="action-buttons">
            <button class="save" onclick="saveGame()">💾 Guardar</button>
            <button class="load" onclick="loadGame()">📂 Cargar</button>
        </div>
        
        <button class="reset" onclick="resetGame()">🗑️ Reiniciar Partida</button>
    </div>

    <script>
        let total1 = 0;
        let total2 = 0;
        let round = 1;

        // Sincronizar nombres
        document.getElementById('name1').addEventListener('input', updateNames);
        document.getElementById('name2').addEventListener('input', updateNames);

        function updateNames() {
            const n1 = document.getElementById('name1').value || 'Equipo 1';
            const n2 = document.getElementById('name2').value || 'Equipo 2';
            
            document.getElementById('thName1').innerText = n1;
            document.getElementById('lbl-name1').innerText = n1;
            document.getElementById('thName2').innerText = n2;
            document.getElementById('lbl-name2').innerText = n2;
        }

        // Permitir usar la tecla Enter
        function handleEnter(event) {
            if (event.key === 'Enter') {
                addScores();
            }
        }

        function addScores() {
            const base1Input = document.getElementById('base1');
            const fichas1Input = document.getElementById('fichas1');
            const base2Input = document.getElementById('base2');
            const fichas2Input = document.getElementById('fichas2');

            const b1 = parseInt(base1Input.value) || 0;
            const f1 = parseInt(fichas1Input.value) || 0;
            const b2 = parseInt(base2Input.value) || 0;
            const f2 = parseInt(fichas2Input.value) || 0;

            if (base1Input.value === "" && fichas1Input.value === "" && 
                base2Input.value === "" && fichas2Input.value === "") {
                return; 
            }

            const p1 = b1 + f1;
            const p2 = b2 + f2;

            total1 += p1;
            total2 += p2;

            document.getElementById('total1').innerText = total1;
            document.getElementById('total2').innerText = total2;

            const tbody = document.getElementById('historyBody');
            const row = document.createElement('tr');
            
            const classP1 = p1 < 0 ? 'negative' : '';
            const classP2 = p2 < 0 ? 'negative' : '';

            row.innerHTML = `
                <td>${round}</td>
                <td class="${classP1}">
                    <strong>${p1}</strong>
                    <span class="round-detail">(B: ${b1} | F: ${f1})</span>
                </td>
                <td class="${classP2}">
                    <strong>${p2}</strong>
                    <span class="round-detail">(B: ${b2} | F: ${f2})</span>
                </td>
            `;
            
            tbody.appendChild(row);

            base1Input.value = '';
            fichas1Input.value = '';
            base2Input.value = '';
            fichas2Input.value = '';
            
            base1Input.focus();
            round++;
        }

        // --- FUNCIONES DE GUARDADO --- //

        function saveGame() {
            const gameState = {
                name1: document.getElementById('name1').value,
                name2: document.getElementById('name2').value,
                total1: total1,
                total2: total2,
                round: round,
                history: document.getElementById('historyBody').innerHTML
            };
            
            localStorage.setItem('burakoSaveData', JSON.stringify(gameState));
            alert('💾 ¡Partida guardada exitosamente!');
        }

        function loadGame() {
            const savedData = localStorage.getItem('burakoSaveData');
            
            if (savedData) {
                if(confirm('¿Deseas cargar la partida guardada? Se reemplazará la partida actual.')) {
                    const gameState = JSON.parse(savedData);
                    
                    // Restaurar variables lógicas
                    total1 = gameState.total1;
                    total2 = gameState.total2;
                    round = gameState.round;
                    
                    // Restaurar nombres en los inputs
                    document.getElementById('name1').value = gameState.name1;
                    document.getElementById('name2').value = gameState.name2;
                    updateNames(); // Sincroniza los nombres en la tabla y etiquetas
                    
                    // Restaurar totales visuales
                    document.getElementById('total1').innerText = total1;
                    document.getElementById('total2').innerText = total2;
                    
                    // Restaurar el historial de la tabla
                    document.getElementById('historyBody').innerHTML = gameState.history;
                }
            } else {
                alert('No hay ninguna partida guardada en este dispositivo.');
            }
        }

        function resetGame() {
            if(confirm("¿Estás seguro de que deseas reiniciar la partida? Los puntajes volverán a cero.")) {
                total1 = 0;
                total2 = 0;
                round = 1;
                document.getElementById('total1').innerText = total1;
                document.getElementById('total2').innerText = total2;
                document.getElementById('historyBody').innerHTML = '';
                
                if(localStorage.getItem('burakoSaveData') && confirm("¿Deseas borrar también la partida que tenías guardada?")) {
                    localStorage.removeItem('burakoSaveData');
                }
            }
        }
    </script>
</body>
</html>
