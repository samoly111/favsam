<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurassic Park — Archivo de la franquicia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1410;
    --bg-panel: #0f1b15;
    --amber-1: #e8a33d;
    --amber-2: #c97a1f;
    --bone: #ece3cf;
    --bone-dim: #b8ad96;
    --line: rgba(236,227,207,0.14);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--bone);
    font-family: 'Archivo', sans-serif;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 10%, rgba(61,92,58,0.25), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(232,163,61,0.08), transparent 35%);
  }

  header{
    position: relative;
    padding: 96px 24px 72px;
    text-align:center;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  header::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(232,163,61,0.05) 0 2px, transparent 2px 40px);
    pointer-events:none;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--amber-1);
    margin-bottom: 22px;
  }

  h1{
    font-family:'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(40px, 7vw, 92px);
    letter-spacing: 0.02em;
    margin: 0;
    line-height: 0.95;
    color: var(--bone);
    text-shadow: 0 0 40px rgba(232,163,61,0.15);
  }

  h1 span{ color: var(--amber-1); }

  .sub{
    max-width: 560px;
    margin: 24px auto 0;
    color: var(--bone-dim);
    font-size: 16px;
    line-height: 1.6;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 28px;
  }

  a.card-art{
    position:relative;
    aspect-ratio: 3 / 4;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    overflow:hidden;
    border-radius: 4px;
    border: 1px solid var(--line);
    text-decoration:none;
    cursor:pointer;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }

  a.card-art:hover{
    transform: translateY(-4px);
    border-color: rgba(232,163,61,0.4);
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(232,163,61,0.08);
  }

  a.card-art::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.35) 100%);
    pointer-events:none;
  }

  .year-tag{
    position:relative;
    z-index:2;
    margin: 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color: var(--bg);
    background: var(--amber-1);
    padding: 4px 8px;
    border-radius: 2px;
    font-weight:600;
  }

  footer{
    text-align:center;
    padding: 40px 24px 60px;
    color: var(--bone-dim);
    font-size: 12px;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.05em;
    border-top: 1px solid var(--line);
  }

  footer a{ color: var(--amber-1); }

  @media (max-width: 480px){
    header{ padding: 64px 20px 48px; }
    main{ padding: 40px 16px 80px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Isla Nublar · Archivo InGen</div>
  <h1>Jurassic <span>Park</span></h1>
  <p class="sub">Registro completo de la franquicia, de 1993 a 2025. Tocá cada portada para ver la reseña y calificación en IMDb.</p>
</header>

<main>
  <div class="grid">

    <a class="card-art" href="https://byselapuix.com/d/xd5y8ifv2lnf/jurassic-park-1" target="_blank" rel="noopener" style="background: url('Jurassic Park.jpg') center/cover no-repeat;">
      <span class="year-tag">1993</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt0119567/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #2c4a23, #12200f);">
      <span class="year-tag">1997</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt0163025/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #4a3423, #1f150e);">
      <span class="year-tag">2001</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt0369610/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #235a4a, #0e2018);">
      <span class="year-tag">2015</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt4881806/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #5a2323, #200e0e);">
      <span class="year-tag">2018</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt8041270/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #4a4823, #1f1e0e);">
      <span class="year-tag">2022</span>
    </a>

    <a class="card-art" href="https://www.imdb.com/title/tt31036941/" target="_blank" rel="noopener" style="background: linear-gradient(155deg, #234a4a, #0e1f1f);">
      <span class="year-tag">2025</span>
    </a>

  </div>
</main>

<footer>
  Los clics en cada portada llevan a la ficha real de la película en <a href="https://www.imdb.com/" target="_blank" rel="noopener">IMDb</a>.
</footer>

</body>
</html>
