<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Tv Player</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:Arial,sans-serif; }

#container { width:100%; height:100%; position:fixed; inset:0; }

/* ── Video HLS (hls.js) ── */
#vid {
  width:100%; height:100%;
  background:#000;
  display:none;
  transform-origin:center center;
  transition:transform 0.25s ease;
}

/* ── iframe DRM ── */
#frm {
  position:absolute; inset:0;
  width:100%; height:100%;
  border:none;
  display:none;
  transform-origin:center center;
  transition:transform 0.25s ease;
}

/* ── Controles Superiores Modernos (Zoom + Pantalla Completa) ── */
#controls-top {
  position:fixed;
  top:12px;
  right:12px;
  z-index:20;
  display:flex;
  gap:6px;
  opacity:0;
  transition:opacity 0.3s;
  background:rgba(0,0,0,0.5);
  padding:6px 8px;
  border-radius:10px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.08);
}

.ctrl-btn {
  background:transparent;
  color:rgba(255,255,255,0.7);
  border:none;
  padding:5px 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
  letter-spacing:0.3px;
  white-space:nowrap;
}
.ctrl-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }
.ctrl-btn:active { transform:scale(.92); }
.ctrl-btn.activo {
  background:rgba(0,150,255,.25);
  color:#fff;
  box-shadow:0 0 20px rgba(0,150,255,.1);
}
.ctrl-btn.activo::after { content:' ✓'; color:#4CAF50; }

.ctrl-separador { width:1px; height:20px; background:rgba(255,255,255,0.1); margin:0 4px; align-self:center; }

#btn-fs {
  background:transparent;
  color:rgba(255,255,255,0.7);
  border:none;
  padding:5px 8px;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
  transition:all .2s;
}
#btn-fs:hover { background:rgba(255,255,255,0.1); color:#fff; }

/* ── Indicador de zoom ── */
#zoom-indicator {
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;
  padding:6px 18px;
  color:#fff;
  font-size:13px;
  font-weight:700;
  opacity:0;
  transition:opacity 0.3s ease, transform 0.3s ease;
  pointer-events:none;
  font-family:inherit;
}
#zoom-indicator.visible {
  opacity:1;
  transform:translateX(-50%) scale(1.05);
}

#btn-ch {
  position:fixed; bottom:20px; left:12px; z-index:20;
  background:rgba(0,0,0,0.55); color:#fff;
  border:1px solid rgba(255,255,255,0.85);
  padding:9px 16px; border-radius:6px;
  font-size:14px; font-weight:600;
  opacity:0; transition:opacity 0.3s; cursor:pointer;
}
#live-badge {
  position:fixed; bottom:24px; right:12px; z-index:20;
  display:flex; align-items:center; gap:6px;
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.live-dot { width:8px; height:8px; border-radius:50%; background:#f00; animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
.live-text { font-size:11px; font-weight:700; letter-spacing:2px; color:#fff; text-shadow:0 1px 4px #000; }

#lbl-canal {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:20; font-size:11px; font-weight:600; color:#fff;
  background:rgba(0,0,0,0.5); padding:4px 10px; border-radius:4px;
  opacity:0; transition:opacity 0.3s; pointer-events:none;
  max-width:60vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ── Spinner de carga ── */
#spinner {
  position:fixed; inset:0; z-index:15;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:0; transition:opacity 0.3s;
}
#spinner.visible { opacity:1; }
.spin-ring {
  width:48px; height:48px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.15);
  border-top-color:#fff;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Menú ── */
#menu {
  position:fixed; inset:0; z-index:60;
  background:#0d0d0d;
  transform:translateX(-100%);
  transition:transform 0.28s ease;
  display:flex; flex-direction:column;
}
#menu.abierto { transform:translateX(0); }
#menu-top {
  padding:14px 14px 10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
#menu-title { font-size:13px; font-weight:700; color:#fff; margin-bottom:8px; }
#busq {
  width:100%; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:6px; padding:8px 12px;
  color:#fff; font-size:13px; outline:none;
}
#busq::placeholder { color:rgba(255,255,255,0.4); }
#lista { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.ch {
  display:flex; align-items:center;
  padding:9px 14px;
  border-bottom:1px solid rgba(255,255,255,0.05);
  cursor:pointer;
}
.ch:active { background:rgba(255,255,255,0.07); }
.ch.activo { background:rgba(255,255,255,0.1); }
.ch-name { font-size:13px; color:#ddd; flex:1; }
.ch.activo .ch-name { color:#fff; font-weight:600; }
.ch-tipo { font-size:9px; font-weight:700; padding:2px 5px; border-radius:3px; margin-left:6px; flex-shrink:0; }
.ch-tipo.drm { background:rgba(255,80,80,0.5); color:#ffd0d0; }
.ch-tipo.hls { background:rgba(0,180,80,0.4); color:#c0ffd0; }
#menu-pie { padding:10px 14px; border-top:1px solid rgba(255,255,255,0.08); }
#btn-cerrar {
  width:100%; background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff; padding:11px; border-radius:6px;
  font-size:14px; font-weight:600; cursor:pointer;
}
</style>
</head>

<div id="btn-ch">☰ Canales</div>

/* ══════════════════════════════════════════════════════════════
   DETECCIÓN AUTOMÁTICA DE TIPO
   — .m3u8 en la URL  →  HLS  (usa hls.js / Safari nativo)
   — cualquier otra   →  DRM  (usa iframe)
══════════════════════════════════════════════════════════════ */
function esHLS(url) {
  return /\.m3u8/i.test(url);
}

/* ══════════════════════════════════════════════════════════════
   REFERENCIAS DOM
══════════════════════════════════════════════════════════════ */
var vid       = document.getElementById('vid');
var frm       = document.getElementById('frm');
var btnFs     = document.getElementById('btn-fs');
var btnCh     = document.getElementById('btn-ch');
var liveBadge = document.getElementById('live-badge');
var lblCanal  = document.getElementById('lbl-canal');
var spinner   = document.getElementById('spinner');
var menu      = document.getElementById('menu');
var listaEl   = document.getElementById('lista');
var busqEl    = document.getElementById('busq');
var btnCerrar = document.getElementById('btn-cerrar');
var controlsTop = document.getElementById('controls-top');
var indicator   = document.getElementById('zoom-indicator');

var ALL_CTRL = [controlsTop, btnCh, liveBadge, lblCanal];

document.getElementById('menu-title').textContent =
  '📡 Canales (' + C.length + ')';

/* ══════════════════════════════════════════════════════════════
   ZOOM  (se mantiene al cambiar de canal, por comodidad)
══════════════════════════════════════════════════════════════ */
var ZOOMS = [
  { label:'1:1',  scale:'scale(1)',    w:'100%', h:'100%', ml:'0',     mt:'0'     },
  { label:'16:9', scale:'scale(1.05)', w:'105%', h:'105%', ml:'-2.5%', mt:'-2.5%' },
  { label:'CROP', scale:'scale(1.15)', w:'115%', h:'115%', ml:'-7.5%', mt:'-7.5%' },
];
var zoomNivel = 0;

function aplicarZoom(z, el) {
  if (!el) return;
  el.style.transform  = z.scale;
  el.style.width      = z.w;
  el.style.height     = z.h;
  el.style.marginLeft = z.ml;
  el.style.marginTop  = z.mt;
}

function setZoom(nivel) {
  zoomNivel = nivel;
  var z = ZOOMS[nivel];
  if (vid.style.display !== 'none') aplicarZoom(z, vid);
  if (frm.style.display !== 'none') aplicarZoom(z, frm);

  document.querySelectorAll('.ctrl-btn').forEach(function(b, i) {
    b.classList.toggle('activo', i === nivel);
  });

  indicator.textContent = z.label + ' ' + ['1.00x','1.05x','1.15x'][nivel];
  indicator.classList.add('visible');
  clearTimeout(indicator._timer);
  indicator._timer = setTimeout(function() {
    indicator.classList.remove('visible');
  }, 1200);

  mostrar();
}

function ciclarZoom() {
  var next = (zoomNivel + 1) % ZOOMS.length;
  setZoom(next);
}

/* ══════════════════════════════════════════════════════════════
   AUTO-OCULTAR CONTROLES (10 seg)
══════════════════════════════════════════════════════════════ */
var hideTimer;
function mostrar() {
  ALL_CTRL.forEach(function(el){ el.style.opacity = '1'; });
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function(){
    ALL_CTRL.forEach(function(el){ el.style.opacity = '0'; });
  }, 10000);
}

/* ══════════════════════════════════════════════════════════════
   SPINNER  — con timeout de seguridad para HLS caídos (12 s)
══════════════════════════════════════════════════════════════ */
var spinGuard = null;

function showSpinner() {
  spinner.classList.add('visible');
  clearTimeout(spinGuard);
  spinGuard = setTimeout(function() {
    spinner.classList.remove('visible');
  }, 12000);
}

function hideSpinner() {
  clearTimeout(spinGuard);
  spinner.classList.remove('visible');
}

/* ══════════════════════════════════════════════════════════════
   INSTANCIA HLS.JS
══════════════════════════════════════════════════════════════ */
var hlsInstance = null;

function destroyHls() {
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
}

/* ══════════════════════════════════════════════════════════════
   CARGAR CANAL
   — Detección automática: .m3u8 → HLS, resto → DRM (iframe)
   — Funciona con nebunexa.life, la14hd.com, streamtpnew.com,
     geo.dailymotion.com y cualquier otra fuente DRM/iframe.
══════════════════════════════════════════════════════════════ */
var idxActivo = -1;

function cargarCanal(idx) {
  idxActivo = idx;
  var ch = C[idx];
  var modo = esHLS(ch.u) ? 'hls' : 'drm';

  lblCanal.textContent = ch.n;
  showSpinner();
  menu.classList.remove('abierto');
  mostrar();
  renderLista();

  var z = ZOOMS[zoomNivel];

  if (modo === 'hls') {
    /* ── MODO HLS ── */
    frm.style.display = 'none';
    frm.src = 'about:blank';

    vid.style.display = 'block';
    aplicarZoom(z, vid);

    destroyHls();

    if (Hls.isSupported()) {
      hlsInstance = new Hls({
        enableWorker:        true,
        lowLatencyMode:      true,
        backBufferLength:    30,
        maxBufferLength:     20,
        maxMaxBufferLength:  40,
        liveSyncDurationCount: 3,
      });
      hlsInstance.loadSource(ch.u);
      hlsInstance.attachMedia(vid);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        vid.play().catch(function(){});
        hideSpinner();
      });
      hlsInstance.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              hlsInstance.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hlsInstance.recoverMediaError();
              break;
            default:
              destroyHls();
              hideSpinner();
              break;
          }
        }
      });
    } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      /* Safari nativo */
      vid.src = ch.u;
      vid.addEventListener('loadedmetadata', function() {
        vid.play().catch(function(){});
        hideSpinner();
      }, { once: true });
    } else {
      /* Navegador sin soporte HLS */
      hideSpinner();
    }

  } else {
    /* ── MODO DRM (iframe) ── */
    /* Funciona con nebunexa.life, la14hd.com, streamtpnew.com, dailymotion, etc. */
    destroyHls();
    vid.style.display = 'none';
    vid.src = '';

    frm.style.display = 'block';
    aplicarZoom(z, frm);
    frm.src = 'about:blank';
    setTimeout(function() {
      frm.src = ch.u;
      hideSpinner();
    }, 400);
  }
}

/* ══════════════════════════════════════════════════════════════
   PANTALLA COMPLETA
══════════════════════════════════════════════════════════════ */
btnFs.addEventListener('click', function(e) {
  e.stopPropagation();
  var el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    screen.orientation && screen.orientation.lock('landscape').catch(function(){});
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    setZoom(0);
  }
});

function actualizarBtnFs() {
  var enFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
  btnFs.textContent = enFS ? '⛶    Cerrar' : '⛶    Ampliar';
  mostrar();
}
document.addEventListener('fullscreenchange',       actualizarBtnFs);
document.addEventListener('webkitfullscreenchange', actualizarBtnFs);

/* ══════════════════════════════════════════════════════════════
   ZOOM — botón + doble tap + doble clic
══════════════════════════════════════════════════════════════ */
document.getElementById('btn-zoom-1').addEventListener('click', function(e) {
  e.stopPropagation(); setZoom(0);
});
document.getElementById('btn-zoom-2').addEventListener('click', function(e) {
  e.stopPropagation(); setZoom(1);
});
document.getElementById('btn-zoom-3').addEventListener('click', function(e) {
  e.stopPropagation(); setZoom(2);
});

// Atajos de teclado
document.addEventListener('keydown', function(e) {
  if (e.key === '1') { e.preventDefault(); setZoom(0); }
  else if (e.key === '2') { e.preventDefault(); setZoom(1); }
  else if (e.key === '3') { e.preventDefault(); setZoom(2); }
});

var lastTap = 0;
document.addEventListener('touchend', function(e) {
  if (menu.classList.contains('abierto')) return;
  if (e.target.closest('#controls-top,#btn-ch,#btn-cerrar')) return;
  var now = Date.now();
  if (now - lastTap < 320) { ciclarZoom(); e.preventDefault(); }
  lastTap = now;
}, { passive: false });

document.addEventListener('dblclick', function(e) {
  if (e.target.closest('#controls-top,#btn-ch,#btn-cerrar')) return;
  ciclarZoom();
});

document.addEventListener('touchstart', function() {
  if (!menu.classList.contains('abierto')) mostrar();
});
document.addEventListener('mousemove', mostrar);

/* ══════════════════════════════════════════════════════════════
   MENÚ DE CANALES
══════════════════════════════════════════════════════════════ */
function renderLista() {
  var q = busqEl.value.trim().toLowerCase();
  var filtrado = q
    ? C.filter(function(ch){ return ch.n.toLowerCase().indexOf(q) >= 0; })
    : C;

  listaEl.innerHTML = '';
  var frag = document.createDocumentFragment();

  filtrado.forEach(function(ch) {
    var ri   = C.indexOf(ch);
    var tipo = esHLS(ch.u) ? 'hls' : 'drm';
    var d    = document.createElement('div');
    d.className = 'ch' + (ri === idxActivo ? ' activo' : '');
    d.innerHTML = '<div class="ch-name">' + ch.n + '</div>'
                + '<span class="ch-tipo ' + tipo + '">' + tipo.toUpperCase() + '</span>';
    d.addEventListener('click', function(){ cargarCanal(ri); });
    frag.appendChild(d);
  });

  listaEl.appendChild(frag);
}

btnCh.addEventListener('click', function(e) {
  e.stopPropagation();
  menu.classList.add('abierto');
  ALL_CTRL.forEach(function(el){ el.style.opacity = '0'; });
  clearTimeout(hideTimer);
  renderLista();
  setTimeout(function(){
    var act = listaEl.querySelector('.ch.activo');
    if (act) act.scrollIntoView({ block:'center' });
  }, 80);
});

btnCerrar.addEventListener('click', function() {
  menu.classList.remove('abierto');
  mostrar();
});

busqEl.addEventListener('input', renderLista);

/* ══════════════════════════════════════════════════════════════
   INICIO — carga el primer canal de la lista
══════════════════════════════════════════════════════════════ */
window.onload = function() {
  mostrar();
  cargarCanal(0);
};
